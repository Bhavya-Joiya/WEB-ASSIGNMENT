<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Hotel Room Booking Form</h1>
    <form align="center">
        <layout for="fname">Full Name: </layout>
        <input type="text" id="fname" name="fname"><br><br>
        <layout for="email">Email: </layout>
        <input type="email" id="email" name="email"><br><br>
        <layout for="phone">Phone Number: </layout> 
        <input type="tel" id="phone" name="phone"><br><br>
        <layout for="checkin">Check-in Date: </layout>
        <input type="date" id="checkin" name="checkin"><br><br>
        <layout for="checkout">Check-out Date: </layout>
        <input type="date" id="checkout" name="checkout"><br><br>
        <layout for="roomtype">Room Type: </layout>
        <select id="roomtype" name="roomtype">
            <option value="single">Single</option>
            <option value="double">Double</option>
            <option value="suite">Suite</option>
        </select><br><br>
        <layout for="requests">Special Requests: </layout><br>
        <textarea id="requests" name="requests" rows="4" cols="50"></textarea><br><br>
        <input type="submit" value="Book Now">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
